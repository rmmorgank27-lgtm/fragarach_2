[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fragarach-ii"
version = "0.1.0"
description = "Storage foundation for trusted historical market-bar evidence"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[project.scripts]
fragarach-ii = "fragarach_ii.commands.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
